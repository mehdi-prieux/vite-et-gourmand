<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modifier une commande — Vite & Gourmand</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #203329; background: #f5f7f3; }
    body { max-width: 700px; margin: auto; padding: 1.5rem; }
    main { background: white; padding: 1.5rem; border: 1px solid #d6dfd7; border-radius: .7rem; }
    form, label { display: grid; gap: .5rem; }
    form { gap: 1rem; }
    input, button { font: inherit; padding: .6rem; border: 1px solid #819587; border-radius: .35rem; }
    button { background: #245a3c; color: white; cursor: pointer; }
    button:disabled { opacity: .55; }
    .error { color: #9b2226; }
    :focus-visible { outline: 3px solid #8a5300; outline-offset: 3px; }
    .skip-link { position: absolute; left: .5rem; top: -5rem; padding: .7rem 1rem; background: white; z-index: 2; }
    .skip-link:focus { top: .5rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <p><a href="client.html">← Retour à mes commandes</a></p>
  <main id="contenu">
    <h1>Modifier une commande en attente</h1>
    <p id="message" role="status" aria-live="polite">Chargement de la commande…</p>
    <form id="edit" hidden>
      <p id="menu"></p>
      <p>Le choix du menu ne peut pas être modifié. La modification est possible uniquement avant acceptation.</p>
      <label>Date de prestation <input name="date_prestation" type="date" required></label>
      <label>Heure de livraison <input name="heure_livraison" type="time" required></label>
      <label>Adresse de livraison <input name="lieu_livraison" type="text" maxlength="255" required autocomplete="street-address"></label>
      <label>Ville de livraison <input name="ville_livraison" type="text" value="Bordeaux" maxlength="100" required></label>
      <label>Nombre de personnes <input name="nombre_personnes" type="number" min="1" max="10000" step="1" required></label>
      <p>Livraison offerte à Bordeaux. Hors Bordeaux : 5 € + 0,59 €/km, calculés par le serveur.</p>
      <button type="submit">Enregistrer les modifications</button>
    </form>
  </main>
  <script>
    'use strict';
    const message = document.getElementById('message');
    const form = document.getElementById('edit');
    const id = new URLSearchParams(location.search).get('commande_id');
    let csrfToken = null;
    const notify = (text, error = false) => { message.textContent = text; message.className = error ? 'error' : ''; };
    async function request(endpoint, options = {}) {
      const response = await fetch('../backend/api/' + endpoint, { credentials: 'same-origin', cache: 'no-store', ...options });
      let data;
      try { data = await response.json(); } catch { throw new Error('Réponse serveur illisible.'); }
      if (!response.ok) { const error = new Error(data.erreur || 'Erreur serveur.'); error.status = response.status; throw error; }
      return data;
    }
    async function initialize() {
      if (!/^[1-9]\d*$/.test(id || '')) { notify('Identifiant de commande invalide.', true); return; }
      try {
        const session = await request('session_courante.php');
        if (session.utilisateur?.role !== 'utilisateur' || typeof session.csrf_token !== 'string') throw new Error('Connexion client requise.');
        csrfToken = session.csrf_token;
        const orders = await request('mes_commandes.php');
        const order = (orders.commandes || []).find(item => String(item.commande_id) === id);
        if (!order) throw new Error('Commande introuvable dans votre compte.');
        if (order.statut !== 'en attente') throw new Error('Cette commande n’est plus modifiable : elle n’est pas en attente.');
        document.getElementById('menu').textContent = 'Menu : ' + order.menu_titre;
        form.elements.date_prestation.value = order.date_prestation;
        form.elements.heure_livraison.value = String(order.heure_livraison).slice(0, 5);
        form.elements.lieu_livraison.value = order.lieu_livraison;
        form.elements.ville_livraison.value = order.ville_livraison || 'Bordeaux';
        form.elements.nombre_personnes.value = order.nombre_personnes;
        form.hidden = false;
        notify('Modifiez les champs souhaités puis enregistrez.');
      } catch (error) { notify(error.message, true); }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const button = form.querySelector('button'); button.disabled = true;
      const fields = new FormData(form);
      try {
        if (!csrfToken) throw new Error('Reconnectez-vous avant de modifier la commande.');
        const result = await request('modifier_commande.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          body: JSON.stringify({ commande_id: Number(id), date_prestation: fields.get('date_prestation'), heure_livraison: fields.get('heure_livraison'), lieu_livraison: fields.get('lieu_livraison'), ville_livraison: fields.get('ville_livraison'), nombre_personnes: Number(fields.get('nombre_personnes')) })
        });
        notify(`Commande n° ${result.commande_id} modifiée. Nouveau prix : ${result.prix_total} €, dont ${result.frais_livraison} € de livraison.`);
        form.hidden = true;
      } catch (error) {
        notify(error.message, true);
        if (error.status === 409 || error.status === 404) form.hidden = true;
      } finally { button.disabled = false; }
    });
    initialize();
  </script>
</body>
</html>
