<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact — Vite & Gourmand</title>
  <link rel="stylesheet" href="assets/site.css"><script src="assets/layout.js" defer></script><script src="assets/site.js" defer></script><script src="assets/contact.js" defer></script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#contenu">Aller au contenu</a><header class="site-header" data-site-header></header>
  <main id="contenu" class="section container">
    <div class="section-heading"><p class="eyebrow">Nous écrire</p><h1>Parlons de votre événement</h1><p class="lead">Décrivez votre besoin ; l’équipe vous répondra à l’adresse indiquée.</p></div>
    <p id="message" role="status" aria-live="polite"></p>
    <form id="contact-form" class="panel form">
      <label>Adresse e-mail<input name="email" type="email" maxlength="150" autocomplete="email" required></label>
      <label>Titre<input name="titre" type="text" minlength="3" maxlength="150" required></label>
      <label>Description<textarea name="description" minlength="10" maxlength="5000" required></textarea></label>
      <button type="submit">Envoyer ma demande</button>
    </form>
  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
