<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mot de passe oublié — Vite & Gourmand</title><link rel="stylesheet" href="assets/site.css"><script src="assets/layout.js" defer></script><script src="assets/site.js" defer></script></head><body data-page="account"><a class="skip-link" href="#contenu">Aller au contenu</a><header class="site-header" data-site-header></header><main id="contenu" class="section container"><div class="section-heading"><h1>Mot de passe oublié</h1><p>Indiquez votre adresse. La réponse reste volontairement identique, qu’un compte existe ou non.</p></div><p id="message" role="status" aria-live="polite"></p><form id="reset-request" class="panel form"><label>Adresse e-mail<input name="email" type="email" maxlength="150" autocomplete="email" required></label><button type="submit">Recevoir le lien</button></form></main><footer class="site-footer" data-site-footer></footer><script>document.getElementById('reset-request').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=document.getElementById('message');button.disabled=true;try{const data=await apiRequest('demander_reinitialisation.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:new FormData(form).get('email')})});message.textContent=data.message;form.reset();}catch(error){message.textContent=error.message;message.className='error';}finally{button.disabled=false;}});</script></body></html>
