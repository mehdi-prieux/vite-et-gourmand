<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nouveau mot de passe — Vite & Gourmand</title><link rel="stylesheet" href="assets/site.css"><script src="assets/layout.js" defer></script><script src="assets/site.js" defer></script></head><body data-page="account"><a class="skip-link" href="#contenu">Aller au contenu</a><header class="site-header" data-site-header></header><main id="contenu" class="section container"><div class="section-heading"><h1>Choisir un nouveau mot de passe</h1><p>Utilisez au moins 12 caractères avec majuscule, minuscule, chiffre et caractère spécial.</p></div><p id="message" role="status" aria-live="polite"></p><form id="reset-password" class="panel form"><label>Nouveau mot de passe<input name="mot_de_passe" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>Confirmation<input name="confirmation" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button type="submit">Mettre à jour le mot de passe</button></form></main><footer class="site-footer" data-site-footer></footer><script>document.getElementById('reset-password').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,values=new FormData(form),message=document.getElementById('message'),button=form.querySelector('button');if(values.get('mot_de_passe')!==values.get('confirmation')){message.textContent='Les mots de passe ne correspondent pas.';message.className='error';return;}button.disabled=true;try{const data=await apiRequest('reinitialiser_mot_de_passe.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),mot_de_passe:values.get('mot_de_passe')})});message.textContent=data.message;message.className='';form.hidden=true;}catch(error){message.textContent=error.message;message.className='error';}finally{button.disabled=false;}});</script></body></html>
