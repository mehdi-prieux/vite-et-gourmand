<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annuler une commande — Vite & Gourmand</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #203329; background: #f5f7f3; }
    body { max-width: 850px; margin: auto; padding: 1.5rem; }
    section, article { background: white; border: 1px solid #d6dfd7; border-radius: .7rem; padding: 1rem; margin: 1rem 0; }
    form, label { display: grid; gap: .7rem; max-width: 420px; }
    input, button { font: inherit; padding: .6rem; border: 1px solid #819587; border-radius: .35rem; }
    button { background: #245a3c; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .danger { background: #9b2226; }
    .error { color: #9b2226; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>Annuler une demande de commande</h1><p><a href="client.html">Retour à mon espace client</a></p></header>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="login-panel">
    <h2>Connexion client</h2>
    <form id="login-form">
      <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe <input name="mot_de_passe" type="password" autocomplete="current-password" required></label>
      <button type="submit">Se connecter</button>
    </form>
  </section>
  <section id="orders-panel" hidden>
    <h2>Mes commandes en attente</h2>
    <p>Seules les demandes non encore acceptées peuvent être annulées. L'annulation est définitive, mais la commande et son historique restent consultables dans votre espace client.</p>
    <button id="refresh" type="button">Actualiser</button>
    <button id="logout" type="button">Se déconnecter</button>
    <div id="orders"></div>
  </section>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    let csrfToken = null;
    function notify(text, error = false) { byId('message').textContent = text; byId('message').className = error ? 'error' : ''; }
    async function request(endpoint, options = {}) {
      const response = await fetch('../backend/api/' + endpoint, { credentials: 'same-origin', cache: 'no-store', ...options });
      let data;
      try { data = await response.json(); } catch { throw new Error('Réponse serveur illisible.'); }
      if (!response.ok) throw new Error(data.erreur || data.error || 'Une erreur est survenue.');
      return data;
    }
    function showOrders(visible) { byId('orders-panel').hidden = !visible; byId('login-panel').hidden = visible; }
    async function loadOrders() {
      const data = await request('mes_commandes.php');
      const container = byId('orders'); container.replaceChildren();
      const pending = Array.isArray(data.commandes) ? data.commandes.filter(order => order.statut === 'en attente') : [];
      if (!pending.length) { const p = document.createElement('p'); p.textContent = 'Aucune commande en attente.'; container.append(p); return; }
      for (const order of pending) {
        const card = document.createElement('article');
        const heading = document.createElement('h3'); heading.textContent = `Commande n° ${order.commande_id}`;
        const details = document.createElement('p'); details.textContent = `${order.menu_titre} — ${order.date_prestation} à ${order.heure_livraison} — ${order.prix_total} €`;
        const button = document.createElement('button'); button.type = 'button'; button.className = 'danger'; button.textContent = 'Annuler cette demande';
        button.addEventListener('click', async () => {
          if (!csrfToken || !confirm(`Annuler définitivement la commande n° ${order.commande_id} ?`)) return;
          button.disabled = true;
          try {
            await request('annuler_commande.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
              body: JSON.stringify({ commande_id: Number(order.commande_id) })
            });
            await loadOrders();
            notify(`Commande n° ${order.commande_id} annulée. Elle reste visible dans l'historique de votre espace client.`);
          } catch (error) { notify(error.message, true); button.disabled = false; }
        });
        card.append(heading, details, button); container.append(card);
      }
    }
    byId('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button'); button.disabled = true;
      const values = new FormData(form);
      try {
        const data = await request('connexion.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: values.get('email'), mot_de_passe: values.get('mot_de_passe') })
        });
        csrfToken = data.csrf_token;
        if (data.utilisateur?.role !== 'utilisateur') {
          await request('deconnexion.php', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
          csrfToken = null;
          throw new Error('Cet espace est réservé aux clients.');
        }
        showOrders(true);
        await loadOrders();
        form.reset(); notify('Connexion réussie.');
      } catch (error) { notify(error.message, true); } finally { button.disabled = false; }
    });
    byId('refresh').addEventListener('click', async () => {
      try { await loadOrders(); notify('Liste actualisée.'); } catch (error) { notify(error.message, true); }
    });
    byId('logout').addEventListener('click', async () => {
      try {
        await request('deconnexion.php', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken || '' } });
        csrfToken = null; byId('orders').replaceChildren(); showOrders(false); notify('Déconnexion réussie.');
      } catch (error) { notify(error.message, true); }
    });
    (async () => {
      try {
        const data = await request('session_courante.php');
        if (data.utilisateur?.role !== 'utilisateur') return;
        csrfToken = data.csrf_token;
        showOrders(true);
        await loadOrders();
      } catch (error) {
        csrfToken = null;
        byId('orders').replaceChildren();
        showOrders(false);
        if (error.message !== 'Authentification requise.') notify(error.message, true);
      }
    })();
  </script>
</body>
</html>
